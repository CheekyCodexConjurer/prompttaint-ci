name: "PromptTaint CI"
description: "Scan repository for risky agentic workflow patterns"
inputs:
  path:
    description: "Path to repository"
    required: false
    default: "."
  format:
    description: "Output format"
    required: false
    default: "markdown"
  fail-on:
    description: "Minimum severity to fail"
    required: false
    default: "high"
runs:
  using: "composite"
  steps:
    - run: |
        cd "${{ github.action_path }}"
        if [ ! -d "dist" ]; then
          npm ci && npm run build
        fi
      shell: bash
    - run: |
        SCAN_PATH="${{ inputs.path }}"
        if [ "$SCAN_PATH" = "." ]; then
          SCAN_PATH="${{ github.workspace }}"
        fi
        node "${{ github.action_path }}/dist/cli.js" scan --path "$SCAN_PATH" --format "${{ inputs.format }}" --fail-on "${{ inputs.fail-on }}"
      shell: bash
